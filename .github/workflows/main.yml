name: Opdater tjans-kalendere

on:
      schedule:
      - cron: "20 3 * * *"
      - cron: "50 11,19 * * *"
  workflow_dispatch:            # kan altid startes manuelt
  push:
    branches: [main]

permissions:
  contents: write               # så robotten kan lægge løst uploadede filer på plads
  pages: write
  id-token: write
  issues: write
  actions: write                # så robotten kan holde natkørslen i live (vedligehold.py)

concurrency:
  group: tjanser
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tjans      # projektet ligger i undermappen tjans/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- Filer uploadet løst i roden (fx fra telefonen) lægges på plads ----
      # Filen genkendes på sit indhold, ikke sit navn, så "render (3).py" også virker.
      # Nye filer kan have en linje "sti: mappe/fil" øverst – så kommer de derhen.
      # Workflow-filer kan robotten ikke flytte; dem retter du direkte i .github/.
      - name: Læg løse filer på plads
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess

          # README'er genkendes på første linje
          FOERSTE_LINJE = {
              "# Aalborg Volley – klubbens værktøjer": "README.md",
              "# Tjanser – Aalborg Volley": "tjans/README.md",
              "# Kørselsudligning – Aalborg Volley": "koerselsudligning/README.md",
          }
          # Kode og sider genkendes på en sætning, der kun står i den fil. Første match vinder.
          INDEHOLDER = [
              ("def gammel_adresse", "tjans/scripts/build.py"),
              ("Renderer status.json til docs/tjanser/index.html", "tjans/scripts/render.py"),
              ("Kontrollerer via Holdsports API, at tjans-aktiviteterne", "tjans/scripts/holdsport.py"),
              ("Åbner, opdaterer eller lukker ét GitHub-issue afhængigt af", "tjans/scripts/alert.py"),
              ("Holder klubbens værktøjer kørende fra sæson til sæson", "tjans/scripts/vedligehold.py"),
              ("Forventet kørselsudligning for klubbens hold", "koerselsudligning/scripts/beregn.py"),
              ("Ét GitHub-issue pr. sæson med den forventede kørselsudligning", "koerselsudligning/scripts/besked.py"),
              ("siden med den forventede kørselsudligning", "koerselsudligning/scripts/render.py"),
              ("<h1>Klubbens værktøjer</h1>", "tjans/docs/index.html"),
              ("Hvad står vi til at få i kontingent?", "tjans/docs/kontingent/index.html"),
          ]
          TILLADT = ("tjans/", "koerselsudligning/")

          def json_af(tekst):
              try:
                  d = json.loads(tekst)
              except ValueError:
                  return None
              return d if isinstance(d, dict) else None

          def maal_for(navn, tekst):
              linjer = tekst.lstrip("\ufeff").splitlines()
              for linje in linjer[:5]:              # "# sti: tjans/scripts/ny.py" o.l.
                  m = re.match(r"\s*(?:#|//|<!--|/\*)?\s*sti:\s*([\w./-]+)", linje)
                  if m and ".." not in m.group(1) and (
                          m.group(1).startswith(TILLADT) or m.group(1) == "README.md"):
                      return m.group(1)
              foerste = next((l.strip() for l in linjer if l.strip()), "")
              if foerste in FOERSTE_LINJE:
                  return FOERSTE_LINJE[foerste]
              if navn.endswith(".csv"):
                  ok = foerste.replace(" ", "").lower().startswith("kampnr,runde,dag,dato,tid,raekke")
                  return "tjans/data/tjanser.csv" if ok else None
              if navn.endswith(".json"):
                  d = json_af(tekst)
                  if d is None:
                      return None
                  feeds = [v for k, v in d.items() if not k.startswith("_")]
                  if feeds and all(isinstance(v, str) and "kampprogram.ashx" in v.lower() for v in feeds):
                      return "tjans/data/feeds.json"
                  if "forening_id" in d and "km_takst" in d:
                      return "koerselsudligning/config.json"
                  if "Skriv her hvad holdene hedder i Holdsport" in tekst:
                      return "tjans/data/holdsport_hold.json"
                  return None
              return next((maal for kendetegn, maal in INDEHOLDER if kendetegn in tekst), None)

          flyttet, ukendt = [], []
          for navn in sorted(os.listdir(".")):
              if not os.path.isfile(navn) or not navn.endswith((".py", ".html", ".md", ".csv", ".json")):
                  continue
              tekst = open(navn, encoding="utf-8", errors="replace").read()
              maal = maal_for(navn, tekst)
              if not maal:
                  ukendt.append(navn)
                  continue
              if maal == navn:
                  continue
              os.makedirs(os.path.dirname(maal) or ".", exist_ok=True)
              shutil.move(navn, maal)
              subprocess.run(["git", "rm", "-q", "--cached", "--ignore-unmatch", "--", navn], check=True)
              subprocess.run(["git", "add", "-A", "--", maal], check=True)
              flyttet.append(f"{navn} -> {maal}")
          print("\n".join(flyttet) or "Ingen løse filer i roden.")
          for navn in ukendt:
              print(f"Kender ikke {navn} – lader den ligge i roden.")
          PY
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Robot: uploadede filer lagt på plads"
            git push -q || echo "Kunne ikke gemme oprydningen i repoet – bygger alligevel med filerne på plads."
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - name: Byg kalendere, statusside og tjek Holdsport
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          HOLDSPORT_USER: ${{ secrets.HOLDSPORT_USER }}
          HOLDSPORT_PASSWORD: ${{ secrets.HOLDSPORT_PASSWORD }}
        run: python scripts/build.py

      # ---- Kørselsudligning (mappen koerselsudligning/) ----------------------
      # continue-on-error: en fejl her må aldrig stoppe tjans-kalenderne.
      - name: Hent cache til kørselsudligning
        uses: actions/cache@v4
        with:
          path: koerselsudligning/cache
          key: koerselsudligning-${{ github.run_id }}
          restore-keys: koerselsudligning-

      - name: Beregn kørselsudligning
        continue-on-error: true
        working-directory: koerselsudligning
        run: python scripts/beregn.py --ud ../tjans/docs/koerselsudligning

      # ---- Ny sæson: påmindelser, og natkørslen holdes i live ----------------
      # Skriver docs/paamindelser.json til startsiden. Må aldrig stoppe siden.
      - name: Hold natkørslen i live og mind om ny sæson
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SIDE: ${{ steps.pages.outputs.base_url }}/
        run: python scripts/vedligehold.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tjans/docs

      - uses: actions/upload-artifact@v4
        with:
          name: status
          path: tjans/docs/status.json

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Giv besked hvis der er huller eller slettede tjanser
        env:
          GH_TOKEN: ${{ github.token }}
          SIDE: ${{ steps.deploy.outputs.page_url }}tjanser/
        run: python scripts/alert.py

      - name: Giv besked om kørselsudligningen
        continue-on-error: true
        working-directory: koerselsudligning
        env:
          GH_TOKEN: ${{ github.token }}
          SIDE: ${{ steps.deploy.outputs.page_url }}koerselsudligning/
        run: python scripts/besked.py ../tjans/docs/koerselsudligning/status.json
